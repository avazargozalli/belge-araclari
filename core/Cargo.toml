[package]
name = "belge-core"
version = "1.3.0"
description = "Belge Araçları ortak çekirdeği: UYAP UDF okuyucu, HTML ve Word (.docx) yazıcıları"
authors = ["Azar Gozalli"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "belge_core"

[[bin]]
name = "belge-core"
path = "src/main.rs"

[dependencies]
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
