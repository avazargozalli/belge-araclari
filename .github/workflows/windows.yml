name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', 'core/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'core/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('windows/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install tooling
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Shared core tests (UDF reader, Word writer)
        run: cargo test --release --manifest-path ../core/Cargo.toml --locked

      - name: Engine tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked

      - name: Build installer
        run: |
          # The Rust cache restores target/, so drop installers left over from earlier versions.
          rm -rf src-tauri/target/release/bundle
          npx tauri build --ci -- --locked

      - name: Install silently and check startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $destination = Join-Path $env:RUNNER_TEMP 'belge-araclari'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Get-ChildItem "$destination/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed application not found' }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          try {
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited unexpectedly: $($app.ExitCode)" }
            Write-Output "Installed and running: $($exe.FullName)"
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Convert sample UDF with the installed app (WebView2 print)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'belge-araclari'
          $exe = Get-ChildItem "$destination/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $udf = (Resolve-Path 'tests/fixtures/ornek-dilekce.udf').Path
          $out = Join-Path $env:RUNNER_TEMP 'udf-check/ornek-dilekce.pdf'
          New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--udf-to-pdf', "`"$udf`"", "`"$out`"") -PassThru
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw 'UDF conversion timed out' }
          if ($process.ExitCode -ne 0) { throw "UDF conversion failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $out)) { throw 'UDF conversion produced no PDF' }
          Write-Output "UDF → PDF: $((Get-Item $out).Length) bytes"

      - name: Check converted UDF content
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet pypdf==5.1.0
          python - "$RUNNER_TEMP/udf-check/ornek-dilekce.pdf" <<'EOF'
          import sys
          from pypdf import PdfReader
          reader = PdfReader(sys.argv[1])
          pages = len(reader.pages)
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          print("pages:", pages)
          print(text[:400])
          assert pages == 2, f"expected 2 pages, got {pages}"
          assert "MAHKEMES" in text, "body text missing"
          assert "Tablo hücresi metni" in text, "table text missing"
          for page in reader.pages:
              xobjects = page["/Resources"]["/XObject"]
              assert "/BelgeAntet" in xobjects, "letterhead layer missing"
          print("UDF conversion content: passed")
          EOF

      - name: Convert sample UDF to Word with the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'belge-araclari'
          $exe = Get-ChildItem "$destination/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $udf = (Resolve-Path 'tests/fixtures/ornek-dilekce.udf').Path
          $out = Join-Path $env:RUNNER_TEMP 'udf-check/ornek-dilekce.docx'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--udf-to-docx', "`"$udf`"", "`"$out`"") -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'Word conversion timed out' }
          if ($process.ExitCode -ne 0) { throw "Word conversion failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $out)) { throw 'Word conversion produced no file' }
          Write-Output "UDF → Word: $((Get-Item $out).Length) bytes"

      - name: Check converted Word content
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - "$RUNNER_TEMP/udf-check/ornek-dilekce.docx" <<'EOF'
          import sys, zipfile
          from xml.dom import minidom
          docx = zipfile.ZipFile(sys.argv[1])
          for name in docx.namelist():
              if name.endswith((".xml", ".rels")):
                  minidom.parseString(docx.read(name))
          document = docx.read("word/document.xml").decode("utf-8")
          assert "MAHKEMES" in document, "body text missing"
          assert "Tablo hücresi metni" in document, "table text missing"
          assert 'behindDoc="1"' in docx.read("word/header1.xml").decode("utf-8"), "letterhead missing"
          assert " PAGE " in docx.read("word/footer1.xml").decode("utf-8"), "page number field missing"
          print("UDF → Word content: passed")
          EOF

      - name: Convert the Word file back to PDF (built-in Word reader, WebView2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'belge-araclari'
          $exe = Get-ChildItem "$destination/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $docx = Join-Path $env:RUNNER_TEMP 'udf-check/ornek-dilekce.docx'
          $out = Join-Path $env:RUNNER_TEMP 'udf-check/word-to-pdf.pdf'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--to-pdf', "`"$docx`"", "`"$out`"") -PassThru
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw 'Word to PDF timed out' }
          if ($process.ExitCode -ne 0) { throw "Word to PDF failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $out)) { throw 'Word to PDF produced no file' }
          Write-Output "Word → PDF: $((Get-Item $out).Length) bytes"

      - name: Check Word → PDF content
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - "$RUNNER_TEMP/udf-check/word-to-pdf.pdf" <<'EOF'
          import sys
          from pypdf import PdfReader
          reader = PdfReader(sys.argv[1])
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          print("pages:", len(reader.pages))
          assert "MAHKEMES" in text, "body text missing"
          assert "Tablo hücresi metni" in text, "table text missing"
          assert "/BelgeAntet" in reader.pages[0]["/Resources"]["/XObject"], "letterhead layer missing"
          print("Word → PDF content: passed")
          EOF

      - name: Convert the PDF and the Word file back to UDF with the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'belge-araclari'
          $exe = Get-ChildItem "$destination/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'udf-check'
          foreach ($pair in @(@('ornek-dilekce.pdf', 'from-pdf.udf'), @('ornek-dilekce.docx', 'from-docx.udf'))) {
            $in = Join-Path $dir $pair[0]; $out = Join-Path $dir $pair[1]
            $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--to-udf', "`"$in`"", "`"$out`"") -PassThru
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw "$($pair[0]) to UDF timed out" }
            if ($process.ExitCode -ne 0) { throw "$($pair[0]) to UDF failed with exit code $($process.ExitCode)" }
            if (-not (Test-Path $out)) { throw "$($pair[0]) to UDF produced no file" }
            Write-Output "$($pair[0]) → UDF: $((Get-Item $out).Length) bytes"
          }

      - name: Check the UDF files follow the Editör rules
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - "$RUNNER_TEMP/udf-check/from-pdf.udf" "$RUNNER_TEMP/udf-check/from-docx.udf" <<'EOF'
          import sys, zipfile
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert names == ["content.xml"], names
              root = ET.fromstring(zipfile.ZipFile(path).read("content.xml"))
              assert root.get("format_id") == "1.8"
              text = root.find("content").text or ""
              units = len(text.encode("utf-16-le")) // 2
              assert all(ord(c) <= 0xFFFF for c in text), "non-BMP character"
              offset = 0
              for el in root.find("elements").iter():
                  if el.tag in ("content", "image"):
                      start, length = int(el.get("startOffset")), int(el.get("length"))
                      assert start == offset, f"gap at {offset} (found {start})"
                      offset = start + length
              assert offset == units, f"offsets cover {offset} of {units}"
              assert "MAHKEMES" in text and "Tablo hücresi metni" in text, "text missing"
              assert root.find("elements").find(".//table") is not None, "table missing"
              print(path, "valid:", units, "characters")
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: udf-sample-output
          retention-days: 7
          path: |
            ${{ runner.temp }}/udf-check/*.pdf
            ${{ runner.temp }}/udf-check/*.docx
            ${{ runner.temp }}/udf-check/*.udf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: belge-araclari-windows
          if-no-files-found: error
          retention-days: 30
          path: windows/src-tauri/target/release/bundle/nsis/*-setup.exe

  release:
    name: Attach installer to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: belge-araclari-windows
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.exe --clobber --repo "${{ github.repository }}"
