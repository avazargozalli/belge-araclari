[package]
name = "belge-araclari"
version = "1.2.1"
description = "Belge Araçları — çevrimdışı PDF araçları"
authors = ["Azar Gozalli"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "belge_araclari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.42"
rayon = "1"
getrandom = "0.3"
tiff = "0.11"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's WebView2 binding, needed for ICoreWebView2_7::PrintToPdf.
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
